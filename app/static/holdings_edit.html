<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Holdings Editor</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="page-shell">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <span class="sidebar-title">Investment Portfolio</span>
        <button type="button" class="sidebar-toggle" id="sidebar-toggle" aria-controls="sidebar" aria-expanded="true" aria-label="Collapse navigation">
          <svg class="sidebar-toggle-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M3 6h18M3 12h18M3 18h18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
          </svg>
        </button>
      </div>
      <nav class="sidebar-nav" id="sidebar-nav" aria-label="Main navigation">
        <a href="/" class="nav-link" title="Dashboard" aria-label="Dashboard">
          <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" />
            <path d="M9 22V12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
            <path d="M15 12v10" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
          </svg>
          <span class="nav-label">Dashboard</span>
        </a>
        <a href="/trades.html" class="nav-link" title="Log Trade" aria-label="Log Trade">
          <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
          </svg>
          <span class="nav-label">Log Trade</span>
        </a>
        <a href="/holdings_edit.html" class="nav-link" title="Holdings Editor" aria-label="Holdings Editor">
          <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
            <path d="M18.5 2.5a2.12 2.12 0 0 0 3 3L12 15l-4 1 1-4 9.5-12.5z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
          <span class="nav-label">Holdings Editor</span>
        </a>
        <a href="/visualizations.html" class="nav-link" title="Visualizations" aria-label="Visualizations">
          <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 19V9M10 19V13M16 19v-5M22 19H2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
          <span class="nav-label">Visualizations</span>
        </a>
      </nav>
    </aside>
    <div class="container">
    <header class="page">
      <div>
        <h1>Holdings Editor</h1>
        <div class="sub">Edit ownership percentages. Each holding's splits must sum to 100%.</div>
      </div>
    </header>

    <div class="message" id="message"></div>

    <div class="section-title">Ownership Splits</div>
    <table class="data" id="editor-table">
      <thead id="editor-head"><tr></tr></thead>
      <tbody id="editor-body">
        <tr><td colspan="20" class="empty">Loading holdings...</td></tr>
      </tbody>
    </table>
  </div>
  </div>

  <script>
const API = '/api/v1';

async function fetchJson(url) {
  const res = await fetch(url);
  if (!res.ok) {
    throw new Error('Request failed: ' + res.status + ' ' + url);
  }
  return res.json();
}

async function putJson(url, payload) {
  const res = await fetch(url, {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload),
  });
  const body = await res.json().catch(() => ({}));
  if (!res.ok) {
    const error = new Error(body.detail || 'Request failed: ' + res.status);
    error.status = res.status;
    throw error;
  }
  return body;
}

function fmtMoney(v) {
  const negative = v < 0;
  const text = Math.abs(v).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  return (negative ? '-$' : '$') + text;
}

function fmtQty(v) {
  const text = String(Number(v).toFixed(6)).replace(/\.?0+$/, '');
  return text === '' || text === '-' ? '0' : text;
}

function fmtNum(v, digits) {
  return Number(v).toLocaleString('en-US', { minimumFractionDigits: digits, maximumFractionDigits: digits });
}

function esc(value) {
  return String(value == null ? '' : value)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

const messageBox = document.getElementById('message');
let owners = [];

function showMessage(text, kind) {
  messageBox.className = 'message ' + kind;
  messageBox.textContent = text;
}

async function load() {
  owners = await fetchJson(API + '/owners');
  const holdings = await fetchJson(API + '/holdings');
  buildTable(holdings);
}

function buildTable(holdings) {
  const headRow = document.getElementById('editor-head').querySelector('tr');
  headRow.innerHTML = '<th>Symbol</th>' +
    owners.map((owner) =>
      '<th>' + esc(owner.name) + ' %</th>' +
      '<th class="num">' + esc(owner.name) + ' Shares</th>' +
      '<th class="num">' + esc(owner.name) + ' Cost Basis</th>'
    ).join('') +
    '<th></th>';

  const tbody = document.getElementById('editor-body');
  tbody.innerHTML = holdings.map(buildRow).join('');
}

function buildRow(holding) {
  const splits = holding.splits || [];
  let html = '<tr data-symbol="' + esc(holding.symbol) + '">' +
    '<td><strong>' + esc(holding.symbol) + '</strong></td>';
  for (const owner of owners) {
    const split = splits.find((s) => s.owner_id === owner.owner_id);
    html += '<td><input type="number" step="0.01" min="0" max="100" class="split-input" ' +
      'data-owner-id="' + owner.owner_id + '" value="' + (split ? split.percentage : 0) + '"></td>';
    html += '<td class="num split-shares" data-owner-id="' + owner.owner_id + '">' +
      (split ? fmtQty(split.shares) : '\u2014') + '</td>';
    html += '<td class="num split-cost" data-owner-id="' + owner.owner_id + '">' +
      (split ? fmtMoney(split.cost_basis) : '\u2014') + '</td>';
  }
  html += '<td><button type="button" class="secondary" data-save="' + esc(holding.symbol) + '">Save</button></td>';
  return html + '</tr>';
}

document.getElementById('editor-body').addEventListener('click', async (event) => {
  const button = event.target.closest('button[data-save]');
  if (!button) {
    return;
  }
  const symbol = button.dataset.save;
  const row = button.closest('tr');
  const inputs = row.querySelectorAll('input.split-input');

  const updates = [];
  for (const input of inputs) {
    const value = Number(input.value);
    if (!Number.isFinite(value) || value <= 0) {
      continue;
    }
    updates.push({ owner_id: Number(input.dataset.ownerId), percentage: value });
  }

  const total = updates.reduce((sum, update) => sum + update.percentage, 0);
  if (Math.abs(total - 100) > 0.05) {
    showMessage(
      'Percentages for ' + symbol + ' must sum to 100% (currently ' + fmtNum(total, 2) + '%).',
      'error'
    );
    return;
  }

  showMessage('Saving ' + symbol + '...', '');
  try {
    const result = await putJson(API + '/holdings/' + symbol + '/owners', updates);
    for (const split of result) {
      const sharesCell = row.querySelector('.split-shares[data-owner-id="' + split.owner_id + '"]');
      const costCell = row.querySelector('.split-cost[data-owner-id="' + split.owner_id + '"]');
      if (sharesCell) {
        sharesCell.textContent = fmtQty(split.shares);
      }
      if (costCell) {
        costCell.textContent = fmtMoney(split.cost_basis);
      }
    }
    showMessage('Splits for ' + symbol + ' saved and recalculated.', 'success');
  } catch (error) {
    showMessage(error.message, 'error');
  }
});

load().catch((error) => {
  document.getElementById('editor-body').innerHTML =
    '<tr><td colspan="20" class="empty">' + esc(error.message) + '</td></tr>';
});
</script>
  <script src="/js/nav.js"></script>
</body>
</html>
