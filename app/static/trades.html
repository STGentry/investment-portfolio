<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log Trade</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="container">
    <header class="page">
      <div>
        <h1>Log Trade</h1>
        <div class="sub">All buys, sells, and dividends are recorded in the audit trail.</div>
      </div>
      <nav class="nav">
        <a href="/">Dashboard</a>
        <a href="/trades.html">Log Trade</a>
        <a href="/holdings_edit.html">Holdings Editor</a>
        <a href="/visualizations.html">Visualizations</a>
      </nav>
    </header>

    <div class="section-title">Trade Details</div>
    <div class="message" id="message"></div>
    <form id="trade-form" class="form-row">
      <div class="field">
        <label for="owner-select">Owner</label>
        <select id="owner-select" required></select>
      </div>
      <div class="field">
        <label for="symbol-input">Symbol</label>
        <input type="text" id="symbol-input" maxlength="10" required placeholder="e.g. SGI">
      </div>
      <div class="field">
        <label for="trade-type">Type</label>
        <select id="trade-type" required>
          <option value="buy">Buy</option>
          <option value="sell">Sell</option>
          <option value="dividend">Dividend</option>
        </select>
      </div>
      <div class="field">
        <label for="quantity-input">Quantity</label>
        <input type="number" id="quantity-input" step="0.000001" min="0.000001" required placeholder="0.000001">
      </div>
      <div class="field">
        <label for="price-input">Price</label>
        <input type="number" id="price-input" step="0.01" min="0" required placeholder="0.00">
      </div>
      <div class="field">
        <label for="trade-date">Trade Date</label>
        <input type="date" id="trade-date" required>
      </div>
      <div class="field">
        <label for="notes-input">Notes</label>
        <input type="text" id="notes-input" maxlength="200" placeholder="Optional">
      </div>
    </form>
    <div class="form-actions">
      <button type="submit" id="submit-button">Log Trade</button>
    </div>

    <div class="section-title">Trade History</div>
    <div class="toolbar">
      <div class="toolbar-item">
        <label for="symbol-filter">Symbol</label>
        <select id="symbol-filter">
          <option value="">All symbols</option>
        </select>
      </div>
    </div>
    <table class="data">
      <thead>
        <tr>
          <th>Symbol</th>
          <th>Type</th>
          <th class="num">Quantity</th>
          <th class="num">Price</th>
          <th>Trade Date</th>
          <th>Notes</th>
          <th class="actions"></th>
        </tr>
      </thead>
      <tbody id="trades-body">
        <tr><td colspan="7" class="empty">Loading trades...</td></tr>
      </tbody>
    </table>
    <div class="form-actions">
      <button type="button" id="save-button">Save Changes</button>
    </div>
  </div>

  <script>
const API = '/api/v1';

async function fetchJson(url, options) {
  const res = await fetch(url, options);
  if (!res.ok) {
    throw new Error('Request failed: ' + res.status + ' ' + url);
  }
  return res.json();
}

async function postJson(url, payload) {
  const res = await fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload),
  });
  const body = await res.json().catch(() => ({}));
  if (!res.ok) {
    const error = new Error(body.detail || 'Request failed: ' + res.status);
    error.status = res.status;
    throw error;
  }
  return body;
}

async function putJson(url, payload) {
  const res = await fetch(url, {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload),
  });
  const body = await res.json().catch(() => ({}));
  if (!res.ok) {
    const error = new Error(body.detail || 'Request failed: ' + res.status);
    error.status = res.status;
    throw error;
  }
  return body;
}

async function deleteJson(url) {
  const res = await fetch(url, { method: 'DELETE' });
  const body = await res.json().catch(() => ({}));
  if (!res.ok) {
    const error = new Error(body.detail || 'Request failed: ' + res.status);
    error.status = res.status;
    throw error;
  }
  return body;
}

function fmtMoney(v) {
  const negative = v < 0;
  const text = Math.abs(v).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  return (negative ? '-$' : '$') + text;
}

function fmtQty(v) {
  const text = String(Number(v).toFixed(6)).replace(/\.?0+$/, '');
  return text === '' || text === '-' ? '0' : text;
}

function esc(value) {
  return String(value == null ? '' : value)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function valueClass(v) { return v >= 0 ? 'positive' : 'negative'; }

const messageBox = document.getElementById('message');
const ownerSelect = document.getElementById('owner-select');
const symbolInput = document.getElementById('symbol-input');
const typeSelect = document.getElementById('trade-type');
const quantityInput = document.getElementById('quantity-input');
const priceInput = document.getElementById('price-input');
const dateInput = document.getElementById('trade-date');
const notesInput = document.getElementById('notes-input');
const tradesBody = document.getElementById('trades-body');
const symbolFilter = document.getElementById('symbol-filter');
const saveButton = document.getElementById('save-button');
let allTrades = [];

function showMessage(text, kind) {
  messageBox.className = 'message ' + kind;
  messageBox.textContent = text;
}

function todayLocal() {
  const now = new Date();
  const pad = (n) => String(n).padStart(2, '0');
  return `${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())}`;
}

async function loadOwners() {
  const owners = await fetchJson(API + '/owners');
  for (const owner of owners) {
    const option = document.createElement('option');
    option.value = String(owner.owner_id);
    option.textContent = owner.name;
    ownerSelect.appendChild(option);
  }
  dateInput.value = todayLocal();
  ownerSelect.addEventListener('change', () => loadTrades());
}

async function loadTrades() {
  const ownerValue = ownerSelect.value;
  try {
    allTrades = await fetchJson(API + '/owners/' + ownerValue + '/trades');
    renderSymbolOptions(allTrades);
    renderTrades();
  } catch (error) {
    allTrades = [];
    tradesBody.innerHTML =
      '<tr><td colspan="7" class="empty">' + esc(error.message) + '</td></tr>';
  }
}

function renderSymbolOptions(trades) {
  const current = symbolFilter.value;
  const symbols = [...new Set(trades.map((trade) => trade.symbol))].sort();
  symbolFilter.innerHTML = '<option value="">All symbols</option>' +
    symbols.map((symbol) => '<option value="' + esc(symbol) + '">' + esc(symbol) + '</option>').join('');
  symbolFilter.value = symbols.includes(current) ? current : '';
}

function renderTrades() {
  const symbol = symbolFilter.value;
  const rows = symbol ? allTrades.filter((trade) => trade.symbol === symbol) : allTrades;

  if (!rows.length) {
    const message = symbol ? 'No trades for symbol ' + esc(symbol) + '.' : 'No trades for this owner.';
    tradesBody.innerHTML = '<tr><td colspan="7" class="empty">' + message + '</td></tr>';
    return;
  }
  tradesBody.innerHTML = rows.map((trade) => {
    const tradeType = trade.trade_type || 'buy';
    return '<tr data-trade-id="' + trade.trade_id + '">' +
      '<td><input type="text" class="trade-symbol" maxlength="10" value="' + esc(trade.symbol) + '"></td>' +
      '<td><select class="trade-type">' +
        '<option value="buy"' + (tradeType === 'buy' ? ' selected' : '') + '>Buy</option>' +
        '<option value="sell"' + (tradeType === 'sell' ? ' selected' : '') + '>Sell</option>' +
        '<option value="dividend"' + (tradeType === 'dividend' ? ' selected' : '') + '>Dividend</option>' +
      '</select></td>' +
      '<td class="num"><input type="number" class="trade-quantity" step="0.000001" min="0.000001" value="' +
        Number(trade.quantity).toFixed(6) + '"></td>' +
      '<td class="num"><input type="number" class="trade-price" step="0.01" min="0" value="' +
        Number(trade.price).toFixed(2) + '"></td>' +
      '<td><input type="date" class="trade-date" value="' + esc(trade.trade_date) + '"></td>' +
      '<td><input type="text" class="trade-notes" maxlength="200" value="' + esc(trade.notes || '') + '"></td>' +
      '<td class="actions">' +
      '<button type="button" class="secondary" data-save="' + trade.trade_id + '">Save</button>' +
      '<button type="button" class="danger tiny" data-delete="' + trade.trade_id + '">Delete</button></td>' +
      '</tr>';
  }).join('');
}

function tradePayload(row) {
  return {
    symbol: row.querySelector('.trade-symbol').value.trim(),
    trade_type: row.querySelector('.trade-type').value,
    quantity: Number(row.querySelector('.trade-quantity').value),
    price: Number(row.querySelector('.trade-price').value),
    trade_date: row.querySelector('.trade-date').value,
    notes: row.querySelector('.trade-notes').value.trim(),
  };
}

// Mark a row as changed as soon as any of its fields are edited.
tradesBody.addEventListener('input', (event) => {
  const row = event.target.closest('tr[data-trade-id]');
  if (row) {
    row.classList.add('dirty');
  }
});
tradesBody.addEventListener('change', (event) => {
  const row = event.target.closest('tr[data-trade-id]');
  if (row) {
    row.classList.add('dirty');
  }
});

symbolFilter.addEventListener('change', renderTrades);

async function saveTrade(row) {
  const tradeId = Number(row.dataset.tradeId);
  const button = row.querySelector('button[data-save]');
  button.disabled = true;
  button.textContent = 'Saving...';
  try {
    await putJson(API + '/trades/' + tradeId, tradePayload(row));
    row.classList.remove('dirty');
    showMessage('Trade ' + tradeId + ' saved.', 'success');
  } catch (error) {
    showMessage(error.message, 'error');
  } finally {
    button.disabled = false;
    button.textContent = 'Save';
  }
}

async function saveChanges() {
  const dirtyRows = Array.from(tradesBody.querySelectorAll('tr.dirty'));
  if (!dirtyRows.length) {
    showMessage('No changes to save.', 'success');
    return;
  }

  saveButton.disabled = true;
  saveButton.textContent = 'Saving...';
  try {
    for (const row of dirtyRows) {
      const tradeId = Number(row.dataset.tradeId);
      await putJson(API + '/trades/' + tradeId, tradePayload(row));
      row.classList.remove('dirty');
    }
    showMessage('Trade changes saved.', 'success');
    await loadTrades();
  } catch (error) {
    showMessage(error.message, 'error');
  } finally {
    saveButton.disabled = false;
    saveButton.textContent = 'Save Changes';
  }
}

saveButton.addEventListener('click', saveChanges);

tradesBody.addEventListener('click', async (event) => {
  const saveButton = event.target.closest('button[data-save]');
  if (saveButton) {
    await saveTrade(saveButton.closest('tr'));
    return;
  }

  const deleteButton = event.target.closest('button[data-delete]');
  if (!deleteButton) {
    return;
  }
  const tradeId = Number(deleteButton.dataset.delete);
  try {
    await deleteJson(API + '/trades/' + tradeId);
    deleteButton.closest('tr').remove();
    showMessage('Trade ' + tradeId + ' deleted.', 'success');
  } catch (error) {
    showMessage(error.message, 'error');
  }
});

document.getElementById('trade-form').addEventListener('submit', async (event) => {
  event.preventDefault();
  messageBox.className = 'message';
  messageBox.textContent = '';
  [ownerSelect, symbolInput, quantityInput, priceInput, dateInput].forEach((el) => el.classList.remove('invalid'));

  const quantity = Number(quantityInput.value);
  const price = Number(priceInput.value);
  const symbol = symbolInput.value.trim();

  if (!ownerSelect.value) {
    ownerSelect.classList.add('invalid');
    showMessage('Please select an owner.', 'error');
    return;
  }
  if (!symbol) {
    symbolInput.classList.add('invalid');
    showMessage('Please enter a symbol.', 'error');
    return;
  }
  if (!Number.isFinite(quantity) || quantity <= 0) {
    quantityInput.classList.add('invalid');
    showMessage('Quantity must be greater than zero.', 'error');
    return;
  }
  if (!Number.isFinite(price) || price < 0) {
    priceInput.classList.add('invalid');
    showMessage('Price cannot be negative.', 'error');
    return;
  }

  const payload = {
    owner_id: Number(ownerSelect.value),
    symbol: symbol,
    trade_type: typeSelect.value,
    quantity: quantity,
    price: price,
    trade_date: dateInput.value,
    notes: notesInput.value.trim() || null,
  };

  const submitButton = document.getElementById('submit-button');
  submitButton.disabled = true;
  submitButton.textContent = 'Saving...';
  try {
    const trade = await postJson(API + '/trades', payload);
    showMessage(
      'Trade #' + trade.trade_id + ' logged (' + trade.trade_type + ' ' + fmtQty(trade.quantity) +
      ' ' + trade.symbol + ' @ ' + fmtMoney(trade.price) + ').',
      'success'
    );
    loadTrades();
  } catch (error) {
    showMessage(error.message, 'error');
  } finally {
    submitButton.disabled = false;
    submitButton.textContent = 'Log Trade';
  }
});

loadOwners().then(loadTrades);
</script>
</body>
</html>
